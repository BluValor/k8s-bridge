clusterName: slurm

configFiles:
  gres.conf: |
    AutoDetect=nvidia

controller:
  slurmctld:
    env:
      - name: WORKLOAD_MIXING_PARTITIONS
        value: "k8s-gpu"
  extraConf: |-
    SelectType=select/cons_tres
    MaxNodeCount=64
    GresTypes=gpu
    ReturnToService=2
    SchedulerParameters=ignore_constraint_validation
    EnforcePartLimits=NO
    JobSubmitPlugins=job_submit/lua
    CliFilterPlugins=cli_filter/lua
    CliFilterParameters=workload_mixing_partitions=k8s-gpu
    NodeSet=k8s_nodes Feature=k8s_dynamic
    PartitionName=k8s-gpu Nodes=k8s_nodes Default=NO State=UP MaxTime=UNLIMITED
  persistence:
    enabled: false

restapi:
  replicas: 1

nodesets:
  slinky:
    enabled: false

loginsets:
  slinky:
    enabled: true
    replicas: 1
    service:
      spec:
        type: ClusterIP

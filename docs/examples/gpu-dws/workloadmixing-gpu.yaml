apiVersion: k8s-bridge.x-k8s.io/v1alpha1
kind: WorkloadMixing
metadata:
  name: gpu
  namespace: slurm
spec:
  controllerRef:
    name: slurm

  partitionsMapping:
    - partition: k8s-gpu
      localQueue: gpu-queue
      dynamicNodeFeature: k8s_dynamic

  mappedResources:
    - resourceName: gpu
      resourceType: nvidia_l4
      k8sResourceName: nvidia.com/gpu
      nodeSelectors:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-flex-start: "true"

  podTemplate:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: cloud.google.com/gke-queued
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: slurmd
          image: ghcr.io/slinkyproject/slurmd:26.05-ubuntu26.04
          securityContext:
            privileged: true
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64

{{- if and .Values.rbac.create .Values.metrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-metrics-auth-role
  labels:
    app.kubernetes.io/component: metrics
    {{- include "k8s-bridge.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-metrics-auth-rolebinding
  labels:
    app.kubernetes.io/component: metrics
    {{- include "k8s-bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-bridge.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-bridge.serviceAccountName" . }}
  namespace: {{ include "k8s-bridge.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-metrics-reader
  labels:
    app.kubernetes.io/component: metrics
    {{- include "k8s-bridge.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}

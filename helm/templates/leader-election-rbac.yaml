{{- if and .Values.rbac.create .Values.manager.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-leader-election-role
  namespace: {{ include "k8s-bridge.namespace" . }}
  labels:
    app.kubernetes.io/component: rbac
    {{- include "k8s-bridge.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-leader-election-rolebinding
  namespace: {{ include "k8s-bridge.namespace" . }}
  labels:
    app.kubernetes.io/component: rbac
    {{- include "k8s-bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-bridge.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-bridge.serviceAccountName" . }}
  namespace: {{ include "k8s-bridge.namespace" . }}
{{- end }}

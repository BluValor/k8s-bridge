---
apiVersion: v1
kind: Secret
metadata:
  name: placeholder-sssd-conf-secret
  namespace: slurm
stringData:
  sssd.conf: |
    [sssd]
    config_file_version = 2
    services = nss, pam
    domains = local

    [nss]

    [pam]

    [domain/local]
    id_provider = local
---
apiVersion: slinky.slurm.net/v1beta1
kind: LoginSet
metadata:
  name: slurm-login
  namespace: slurm
spec:
  controllerRef:
    name: slurm
  sssdConfRef:
    name: placeholder-sssd-conf-secret
    key: sssd.conf
  # LINT.IfChange(slurm_version_pair)
  initconf:
    image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu24.04
  # Provision the unprivileged test user "foo" (UID/GID 2000) via postStart so
  # jobs submitted from the login pod run as a non-admin account rather than root.
  login:
    image: ghcr.io/slinkyproject/login:26.05-ubuntu24.04
  # LINT.ThenChange(test/utils/slurm.go:slurm_version_pair)
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/sh
            - -c
            # LINT.IfChange(slurm_test_user)
            - id -u foo >/dev/null 2>&1 || (groupadd -g 2000 foo && useradd -u 2000 -g 2000 -d /tmp -s /bin/bash foo)
            # LINT.ThenChange(test/utils/login_node.go:slurm_test_user)

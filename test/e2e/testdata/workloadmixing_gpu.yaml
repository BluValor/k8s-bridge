apiVersion: k8s-bridge.x-k8s.io/v1alpha1
kind: WorkloadMixing
metadata:
  name: workloadmixing-gpu
  namespace: slurm
spec:
  controllerRef:
    name: slurm
  partitionsMapping:
    - partition: workloadmixing-partition
      localQueue: test-local-queue
      dynamicNodeFeature: dynamic_kpartition
  mappedResources:
    - resourceName: gpu
      resourceType: nvidia_l4
      k8sResourceName: nvidia.com/gpu
    - resourceName: gpu
      resourceType: ""
      k8sResourceName: nvidia.com/gpu
  podTemplate:
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: slurmd
          # LINT.IfChange(slurm_version_pair)
          image: ghcr.io/slinkyproject/slurmd:26.05-ubuntu24.04
          # LINT.ThenChange(test/utils/slurm.go:slurm_version_pair)
          securityContext:
            privileged: true
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  # LINT.IfChange(slurm_test_user)
                  - id -u foo >/dev/null 2>&1 || (groupadd -g 2000 foo && useradd -u 2000 -g 2000 -d /tmp -s /bin/bash foo)
                  # LINT.ThenChange(test/utils/login_node.go:slurm_test_user)

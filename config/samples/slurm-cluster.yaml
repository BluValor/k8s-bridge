imagePullPolicy: Always
controller:
  jwtHs256KeyRef: foo
  logfile:
    image:
      repository: docker.io/library/alpine
      tag: latest
  extraConf: |-
    SchedulerParameters=ignore_constraint_validation
    NodeSet=kdyn_nodes Feature=dynamic_kpartition
    PartitionName=workloadmixing-partition Nodes=kdyn_nodes State=UP
  podSpec:
    nodeSelector:
      cloud.google.com/gke-nodepool: default-pool

restapi:
  replicas: 1
  slurmrestd:
    image:
      repository: gcr.io/gke-release-staging/slinky/slurmrestd
      tag: 25.11-ubuntu24.04-gke.13
  podSpec:
    nodeSelector:
      cloud.google.com/gke-nodepool: default-pool

loginsets:
  slinky:
    enabled: true
    replicas: 1
    login:
      securityContext:
        privileged: true
    podSpec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool

nodesets:
  slinky:
    enabled: false

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    name: Create Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify tag matches VERSION file
        run: |
          EXPECTED_TAG="v$(tr -d '[:space:]' < ./VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Error: Git tag (${GITHUB_REF_NAME}) does not match VERSION file (${EXPECTED_TAG})" >&2
            exit 1
          fi
          make version-sync
          git diff --exit-code

      - name: Build consolidated installer manifest
        run: make build-installer

      - name: Package Helm chart
        run: helm package ./helm

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "${GITHUB_REF_NAME}" | grep -Eq '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/install.yaml \
            k8s-bridge-*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${PRERELEASE_FLAG}
